name: Build Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    if: ${{ false }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          testMode: EditMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: test-results
          retention-days: 14

  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # 暂时不缓存 Library：
      # 之前用 restore-keys 会命中旧提交的 Library，导致 "Build asset version error"
      # 和幽灵资产（SampleScene.unity 已从仓库删除却仍被导入），最终 Unity 段错误退出 139。
      # 先跑通一次干净构建，再加回精确 key（不带 restore-keys）。
      # - uses: actions/cache@v4
      #   with:
      #     path: Library
      #     key: Library-Android-v2-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          buildMethod: BuildScript.BuildAndroid
          androidExportType: androidPackage
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-project-settings
          path: ProjectSettings
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/Android
          if-no-files-found: error
          retention-days: 14

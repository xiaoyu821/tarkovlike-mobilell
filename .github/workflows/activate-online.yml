name: Activate Online

# 用 Unity 账号在 runner 上联网激活 Personal 许可证，并导出 .ulf。
# 需要仓库 secret：UNITY_EMAIL、UNITY_PASSWORD。
# 账号若开启 2FA，命令行登录会失败，需临时关闭。

on:
  workflow_dispatch:

env:
  UNITY_VERSION: 6000.0.32f1
  UNITY_CHANGESET: b2e806cf271c

jobs:
  activate:
    name: Activate and export .ulf
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check secrets
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "缺少 UNITY_EMAIL 或 UNITY_PASSWORD secret"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2 libgtk-3-0 libglu1-mesa \
            libnss3 libxss1 libxtst6 libxrandr2 libxcursor1 libxi6 \
            libasound2 libgbm1

      - name: Prepare disk
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/unity
          sudo chown -R "$USER":"$USER" /mnt/unity

      - name: Download editor
        run: |
          set -euo pipefail
          cd /mnt/unity
          curl -L --retry 3 --retry-delay 5 -o Unity.tar.xz \
            "https://download.unity3d.com/download_unity/${UNITY_CHANGESET}/LinuxEditorInstaller/Unity-${UNITY_VERSION}.tar.xz"

      - name: Extract editor
        run: |
          set -euo pipefail
          cd /mnt/unity
          tar -xf Unity.tar.xz

      - name: Activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          cd /mnt/unity
          ./Editor/Unity -batchmode -nographics \
            -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
            -quit -logFile - || true
          LIC="$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
          ls -lh "$LIC"
          mkdir -p /mnt/unity/out
          cp "$LIC" /mnt/unity/out/

      - name: Upload license
        uses: actions/upload-artifact@v4
        with:
          name: unity-license-file
          path: /mnt/unity/out/Unity_lic.ulf
          if-no-files-found: error
